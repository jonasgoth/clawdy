<svg xmlns="http://www.w3.org/2000/svg" viewBox="-15 -25 45 45" width="500" height="500">
  <defs>
    <style>
      /* The name tag floats at about y = -5.7, so everything here stays below y = -2. */
      .ask-body { transform-origin: 7.5px 15px; animation: ask-hop 1s infinite ease-in-out; }
      .ask-shadow { animation: ask-s 1s infinite ease-in-out; }
      .ask-claw { transform-origin: 13px 10px; animation: ask-wave 0.5s infinite ease-in-out; }
      .ask-mark { transform-origin: 7.5px 4.6px; animation: ask-pop 0.5s infinite ease-in-out; }
      @keyframes ask-hop {
        0%, 100% { transform: translateY(0) scaleY(1); }
        15%      { transform: translateY(0.4px) scaleY(0.92); }
        50%      { transform: translateY(-1px) scaleY(1.05); }
        85%      { transform: translateY(0.4px) scaleY(0.94); }
      }
      @keyframes ask-s {
        0%, 100% { opacity: 0.5; transform: scaleX(1); }
        50%      { opacity: 0.28; transform: scaleX(0.75); }
      }
      @keyframes ask-wave {
        0%, 100% { transform: rotate(-18deg); }
        50%      { transform: rotate(22deg); }
      }
      /* Wiggles and grows upward only: the origin is the mark's own bottom edge, so it never
         reaches down into the crab's head or up into the name tag. */
      @keyframes ask-pop {
        0%, 100% { transform: rotate(-7deg) scale(1); }
        50%      { transform: rotate(7deg) scale(1.18); }
      }
    </style>
  </defs>

  <rect class="ask-shadow" x="3" y="15" width="9" height="1" fill="#000" opacity="0.5"/>

  <!-- Chunky exclamation mark, filling the gap between name tag and head -->
  <g class="ask-mark">
    <g fill="#FF9F1C">
      <rect x="5.3" y="-1" width="4.4" height="3.2"/>
      <rect x="5.3" y="3.4" width="4.4" height="1.2"/>
    </g>
    <g fill="#FFD700">
      <rect x="6.1" y="-1" width="1.3" height="3.2"/>
      <rect x="6.1" y="3.4" width="1.3" height="1.2"/>
    </g>
  </g>

  <g class="ask-body">
    <g fill="#DE886D">
      <!-- legs -->
      <rect x="3" y="13" width="1" height="2"/><rect x="5" y="13" width="1" height="2"/>
      <rect x="9" y="13" width="1" height="2"/><rect x="11" y="13" width="1" height="2"/>
      <!-- shell (same size as the other pets) -->
      <rect x="2" y="6" width="11" height="7"/>
      <!-- left claw, held up -->
      <rect x="0" y="9" width="2" height="2"/>
    </g>
    <!-- right claw waves for your attention -->
    <rect class="ask-claw" x="13" y="8" width="2" height="3" fill="#DE886D"/>
    <!-- wide-awake eyes + open mouth (calling you) -->
    <g fill="#000">
      <rect x="4" y="8" width="2" height="2"/>
      <rect x="9" y="8" width="2" height="2"/>
      <rect x="6" y="11" width="3" height="1"/>
    </g>
    <g fill="#FFF">
      <rect x="4" y="8" width="1" height="1"/>
      <rect x="9" y="8" width="1" height="1"/>
    </g>
  </g>
</svg>
